  - jp_us_coordinated_intervention_15y_first: "★**今週の最大イベント**。7/30(木)に日本の円買い・ドル売り介入（NY時間、USD/JPY 163→158、円は最大3.3%急騰、**ドルは2023年1月以来最大の日次下落**）、7/31(金)に米財務省が複数行へ「待機」通告＝レートチェック。**--news #5（読売・2026-08-02）が『日米が協調為替介入 15年ぶり』を確定報道**。Boss §5が「金曜終盤の当局対応は断定できる報道が無い＝可能性に留めるのが安全」と保留していた点を**正規ソースで解決**（Boss執筆8/1より後の報道＝時間差で矛盾ではない）。裏付け: 米財務省の通告（ロイター）、ベッセント財務長官「円は非常に過小評価されている」、三村財務官「米国から心理的支援を超える支援を受けている」、ロイターが「協調介入」と明記。**今回は米国が公に参加した最初の介入であり、単なる円防衛ではなく『米国がドル安側に立ったこと自体が新しい層』**（Boss §5③）。EBSのスポット円出来高は10年ぶり、CME先物出来高は過去最高。"
  - imf_episode_window_exhausted_asymmetry: "**3営業日ルールの正体はIMFのエピソード計数の慣行**（3営業日以内の介入は1回の市場操作としてカウント）＝当局の行動可能期間を縛るルールではない。7/30(木)起点なら**7/31(金)・8/3(月)までは同一エピソード**、**8/4(火)以降の新規介入は4回目**となり6ヶ月3エピソードのfree-floating分類を逸脱。**日本は枠を使い切った**（4/30-5/1＝1回目、5/6＝2回目、7/30＝3回目。1回目がルックバックから外れるのは10月末）。ただし**IMFの枠が縛るのは日本の分類であって米財務省の行動ではない**ため『日本の枠切れ＝無防備』とは限らない。★**非対称（Boss §5①）**: **NFPは8/7(金)でエピソード窓（〜8/3月）の外側**に落ちる＝強いNFP→9月利上げ観測強化→ドル円上昇が**日本が撃てない期間に起きる**。ただし市場も同じ公開ルールを見ているため**8/4以降のドル円ロングは混雑しやすく、日付エントリーではなく『当局が撃たないことを価格が証明した後』（161回復して叩かれない）を待つ**のが型と整合。"
  - curve_twist_steepener_5s10s_missed_3m10s_caught: "★★**年輪の実証**。Boss命名「ツイスト・スティープナー」＝US2Y週足-1.73%（4.331→4.262・低下）vs US10Y週足+0.79%（上昇）、真の2s10s +34.8→**+45.6bp**。**機械5s10sは『stable』で取り逃がした**（^FVX=5Y proxyがbellyにあり、真の2年債が下がったのに+0.034**上昇**＝逆方向）。**3m10sは捉えた**（^IRX=3Mが政策感応で-0.123低下、3m10s +87.4→+106.3bp＝**+18.9bpスティープ化**、shape=bull_steepening）。→ 2026-06-27の年輪が「主ゲージは3m10s」と決めた判断が**実測で正しさを証明**。同時に**新しい学び**＝proxyの限界は『方向を誇張する（過大評価）』だけでなく『**方向転換を検知できない（無反応）**』形でも出る。役割分担は **5s10s=bellyの動き / 3m10s=frontの政策織り込み** で確定。"
  - fomc_hold_9_3_dissent_sept_64pct: "FOMC（7/28-29）は政策金利3.50-3.75%を**5会合連続据え置き**。採決は**9対3**でカシュカリ・ハマック・ローガンの3名が**「利上げ」方向に反対票**＝多数派と逆方向の反対票としては**2016年9月以来の多さ**（Boss §5で裏付け確認済）。新議長Kevin Warshは「フォワードガイダンスの提供からさらに離れる」と明言し、市場は**ガイダンスを出さないFedへの調整**として利回りを押し上げた（10Y +8.1bp／30Y +約12bp／2Y +1bp）。金曜時点のFF金利先物は**9月利上げ確率 約64%**。コアPCE（6月）は前年比+3.3%。Q2 GDP速報は**+1.5%（予想2.1%）の未達**でドル安の一因。市場は指標一発ごとにボラが出やすい構造へ変化。"
  - ai_capex_doubt_resolved_into_selection: "★**wk04の『AI capex懸念』が今週決着＝懸念でなく選別に変質**（Boss §5）。クラウド成長: **Alphabet +82% / Azure +43%（予想40.2%）/ AWS +37%（予想31%、2021年以来最速）**。Amazonは設備投資を**$2,200億へ引き上げてなお時間外+10%**＝市場は『capexの大きさ』ではなく『**回収の器を持つか**』で評価。**Metaのみ-8.8%**（クラウドという回収の器を持たない広告会社＝例外）、**Appleは時間外-4%**。→ 株の反発は全面ではなく**クラウドを持つ側だけ**。SOX指数+8%、サムスン営業利益は前年比で桁違いの増益、メモリ需要は2029年まで。日本はキオクシアが売買代金約3兆6,953億円の歴史的出来高でストップ高・5月の窓埋め完了。韓国はレバレッジETFの段階的縮小要請＝投げ売り一巡で**KOSPI +17.91%**の記録的リバウンド（※基準＝週次終値か安値からの戻り幅かはBoss §5が要確認としている）。"
  - boj_hawkish_hold_1pct_but_guidance_short: "日銀は政策金利**1.00%据え置き**だが明確な**タカ派ホールド**＝①**高田委員が利上げを主張して反対票**、②声明で**「基調的インフレが2%目標を上回って推移するリスク」を初めて明示**、③植田総裁が会見で「2026年度下期からCPIは2%を明確に上回る」「多くの委員の物価見通しは高め、リスクは上方に偏る」。スコシアバンクは「**9月会合での引き締めに非常に開かれたタカ派ホールド**」と評価、ロイター調査は**年内1.25%**、MUFGは**9月＋2027年1月**を予想。ただしMUFGスコアリングでは会見のタカ派度は**23.3（前回17.0）に留まり**「近い将来の利上げを積極的に織り込ませるフォワードガイダンスはなかった」＝**介入直後だけに、より強い言葉を期待した向きには不足**で、これが**金曜に円が戻された一因**。市場評価は『介入は持続的な円高をもたらさず、**BOJの利上げがなければ円の見通しは改善しない**』が一般的。"
  - vix_gate_reopened_below_18: "VIX 15.99で**18割れ＝Add risk gate 再開**（wk03・wk04の2週連続閉鎖から転換）。AI/クラウド決算による株の復活とSOX+8%がボラを鎮めた形。ただしBossの時間軸観は「**8/10の週から一段の下落を警戒、逆に言えば8/10までは上値を試す**」＝gate再開は**全面リスクオンの承認ではなく期間限定の上値トライ許可**として読む。再閉鎖のトリガーは NFP上振れ・US10Y 4.75%超え・WTI 88.5上抜け。"
  - gold_dollar_quality_split_dxy_not_usdjpy: "★**今週最大のtell**。協調介入＋ハト派に読まれたFOMC＋GDP未達という**ヘッドライン上は最もドルネガティブな週に、金は週足で下げて引けた**（4,046.34・-0.17%、snapshot gold range→**off**）。理由は『**ドル安の質**』が木曜と金曜で変わったこと＝木曜はDXY-0.8%で100割れの**ドル全面安**（金は4,120まで上昇）、金曜は米イラン緊張再燃と月末利確で**DXYが反発し円だけが強い**構図へ。**金はDXYに追随し、USD/JPYには追随しなかった**＝『円高＝金高』ではない。月末利確・換金売りは副次的で、これが構造的な理由。**用語の精緻化**: 名目=実質+BE であり7/29は**実質+6bp・BE+5bpの同時上昇**＝インフレ期待でも純粋な引き締めでもなく**タームプレミアム／ソブリン信用の再評価**の象限。この象限では金の逆風（機会費用↑）と追い風（準備資産分散）が同じ源から出るため**方向を論理で事前に導出できずフローの量で決まる**。**レンジを上に破るのは『インフレが出ること』ではなく実質金利が下がること**で、その種はQ2 GDP 1.5%の未達にある。"
