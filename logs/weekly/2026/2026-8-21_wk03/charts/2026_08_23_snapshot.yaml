curve_spreads:
  # renamed 2026-08-09: curve_2s10s → curve_spreads / change_bp → change_bp_30d / change_3m10s_bp → change_3m10s_bp_30d
  #   旧名は 2026-08-09 以前の distilled・週次アーカイブに残っている。同名の別指標ではなく同一指標の旧名。
  #   （旧 curve_2s10s は中身が 5s10s/3m10s/belly/10s30s で 2s10s を1つも含まなかったための改名）
  spread_bp: 31.4            # 5s10s（US10Y − US5Y=^FVX）※符号は市場慣行の【長期−短期】
  change_bp_30d: 6.1
  shape: bull_steepening            # 5s10s の質
  inverted: false
  spread_3m10s_bp: 102.8      # 3m10s（US10Y − US3M=^IRX）=Fed重視の景気後退カーブ・逆イールド主ゲージ
  change_3m10s_bp_30d: 15.4
  shape_3m10s: bull_steepening
  spread_3m5s_bp: 71.4
  belly_premium_bp: 21.3      # 5Yの直線補間からの突出度（+=belly elevated/hump）
  structure: belly_elevated      # front=政策(3M)/belly=5Y/long=growth(10Y) の形
  recession_3m10s: positive      # positive/near_inversion(<25bp)/inverted
  points_pct: {m3: 3.71, y5: 4.424, y10: 4.738, y30: 5.276}
  spread_10s30s_bp: 53.8      # 10s30s（US30Y=^TYX − US10Y）=超長期のタームプレミアム
  change_10s30s_bp_1w: -3.1      # 週次Δ（7暦日前以前の最後の終値が基準）
  change_10s30s_bp_30d: 5.5      # 30日Δ（構造的ドリフト）
  direction_10s30s_1w: narrowing      # 【週次Δ】の符号のみ（widening/narrowing/flat）。閾値は未設定＝判定はしない
  note: "スプレッドの符号はすべて市場慣行の【長期−短期】（2s10sが+45bpなら10Yが2Yより45bp上）。5s10s（US10Y−US5Y=^FVX）は5年がカーブ中腹のため、front=政策(3M)が belly(5Y) より低い順イールド環境では最もフラットな区間＝5s10sのbear_flatteningは逆イールド接近を過大評価しうる。景気後退の主ゲージは 3m10s（spread_3m10s_bp）で読む。structure=belly_elevated は政策ターミナル織り込みの瘤＝front低・belly突出・long growth。shape*は短期↑/長期↓のフラット化の質、recession_3m10s が near_inversion/inverted に入ったら本格警戒。10s30s は【水準・Δ(週次/30日の2窓)・方向(週次Δの符号のみ)】を出すだけでレジームラベル・複合スコアには混ぜない。閾値を置かないのはサンプルが4営業日分しかないため。8〜12週ためてから閾値の検討を行う。同じスプレッドでも窓が違えば符号が逆になりうる（30日では拡大・直近1週では縮小 等）ので、必ず窓を明示して引用すること。★本欄（機械のclose-to-close系列）が 10s30s の正本。手読みの値と1本の時系列に混ぜない。理由は【時刻とベンダーの二重の不一致】。手読みはスクショを撮った時刻に依存し（NY引け/ロンドン午後が混在しうる）、ベンダーも異なる。日次変動が1〜3bpの指標では、変化の大半が時刻差になりうる。※この2つの誤差源はまだ分離できていない（純粋なベンダー差の比較は同一時刻同士の n=1 のみ）。分離できれば併用可能になる余地は残る。機械側は毎日同じ時刻・同じベンダーで自動的に積み上がるため、8〜12週の計数はこちらで数える。読み筋（人間側・★未検証）: 拡大=タームプレミアム／ソブリン信用の象限で金に追い風、縮小=純粋なディスインフレで金には何も来ない。2026-08-09時点で機械系列による裏づけは無い（7営業日で符号一致5/7だが、金が週で最も上げた8/5に10s30sは縮小）。機構の仮説として保持し、実測の主張はしない。★本欄は【事後の記録】であって当日の判定には使えない。CPI等の当日反応は【同一日・同一チャートのセッション内前後比較】で見る（発表直前に 30Y−10Y を読み、反応が落ち着いた頃に同じチャートで再度読み、その2点の差を取る）。同じ日・同じ時間帯・同じベンダーなので時刻差もベンダー差も入らない。求めているのは当日の変化であって水準ではない。"

