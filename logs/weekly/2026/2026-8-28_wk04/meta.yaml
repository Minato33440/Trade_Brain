  - gold_three_layer_overlap_actually_fired: "⚠️★**wk03 で『JH で金が叩かれれば CFD と現物の両方に同時に逆風＝リスクは分散されていない』と書いた配置が、そのまま実現した**。金エクスポージャーは **CFD 1.0 Lot ＋ GDX 15株 ＋ GXゴールド 425A（特定750口＋NISA2,000口）の3層**で、当週は全てが同方向に効いた。★**ただし 425A 特定は +20,925 でプラスを維持し、GDX も円安のおかげで円換算では小幅減に留まった**ため、**総資産レベルでは吸収された**。★**損出し候補（513A/6954/200A）は 8/26 -43,344 → 8/28 13:30 -24,800 → 週末 -34,996 と2日で2回前提が反転**（Rex§F）。**税の理屈（待つ方が有利）は成立するが、待つこと自体に価格変動リスクがあることが実測で出た**"

