signals:
  - nfp_minus_23k_stagflation_conundrum: "★**今週の最大イベント**。**7月NFP -23,000人**（ダウ・ジョーンズ予想+83,000人）＝増加どころか**純減**。さらに深刻なのが**改定**で、5月 +129,000→**+63,000**（-66千）、6月 +57,000→**+20,000**（-37千）＝**2ヶ月合計-103,000人の下方修正**。過去12ヶ月平均も月**+34,000人**まで鈍化。内訳は地方政府教育-50,000／小売-19,000／金融-14,000（2025年5月ピークから累計-121,000）、増加は**ヘルスケア+22,000のみ**でそれも過去平均+36,000を下回る。★**ただしヘッドラインの失業率は4.2%→4.1%に『低下』**——これは**労働参加率が61.5%→61.4%と5年超ぶりの低水準**に落ち込んだため（1月からは-0.7pt）で『**職探しをやめた人が増えた結果の失業率低下**』という**質の悪い改善**。一時解雇者は+153,000増えて**921,000人**。平均時給は+2セント（**前年比+3.2%**）でインフレ圧力は残存。→ **『雇用は純減、しかしインフレは高止まり』＝スタグフレーション型の最悪の組み合わせ**で、CNBC引用のWilsey Asset Management も FRB が『**conundrum（板挟み）**』に置かれたという趣旨。"
  - hike_postponed_not_denied_sept42_oct57: "★**ここが肝**。『米金利引き上げ否定が織り込まれた』は**半分正しく、半分は行き過ぎ**。CME FedWatchベースで **9月利上げ確率 約42%**（発表前から大幅低下・50%割れ）だが **10月までの利上げ確率は57%超**＝**依然として過半数が利上げを見込む**。→ **利上げは『否定』されたのではなく『9月から10月以降へ後ろ倒し』されただけ**。裏付けが債券の値動きで、**US2Yは日中安値4.154%まで急低下した後、引けにかけて4.199%まで4.5bp買い戻され**、US10Yも4.639%まで下げた後4.649%で引け。★**市場は金利低下を最後まで追いかけなかった**、というのが金曜の本質。**US2Yの4.154%を割るか、4.256%を超えるかが今週すべての起点**。"
  - gold_bid_stagflation_hedge_2notch_upgrade: "★**snapshot gold が off→bid へ2段階改善**（30日+5.09%・週次+7.20%）＝レジームラベル自体が **`Gold Bid`** に変わった。Boss実測は現物 **4,342.41（+2.43%）**・日中高値 **4,370.49** で**7週間ぶり高値圏**、日足抵抗**4,302.18も上抜け**。理由の3層: ①**スタグフレーション懸念（金の最も好きな環境）** ②**ドル安**（DXY 6週ぶり安値圏・99.527の直前） ③**ホルムズ再開交渉進展→原油下落**（金は原油と逆相関）＋中銀の継続買い。★**ただし1/29の史上最高値5,585〜5,589から依然20%以上下**で**日足の大きな下降チャネル内の戻り**。**4,302.18を上抜けサポートとして守れるかが試金石**で、割れれば『一日限りの過剰反応』と判断して4,248まで撤退。"
  - gold_campaign_closed_flat_6win0loss: "★**CFDゴールドは8/7に全決済しフラット**（持ち越しなし）。専用トレードレポート `Gold-2026-06-12_to_08-07 .md` により**6/12建て→8/7全決済の57日キャンペーンが reconciled**。**確定6件・6勝0敗（勝率100%）・pnl_%合計+21.06%・ロット加重+505.75 pt·Lot**、最大逆行は7/17週の安値4,012.7時点で**-76.7 pt·Lot**。**当週分（8月）は X5+X6 = +224.25 pt·Lot（+10.94%）**: **X5 = 8/6 10:00 に0.5Lotを4,300で計画決済**（実行帯4,250-4,300到達＋**根拠の質の劣化＝イラン外務省が交渉を否定**。当初の水準条件を**8/5に日付条件へ設計変更**し4,302.18の反落をほぼ天井で捕捉）、**X6 = 8/7 23:30 に残0.5Lotを4,350で決済**（NFP急騰で高値4,370.51→**1分足DT切り下げ**）。玉割当は**FIFO採用**（両玉とも益のため論理制約が働かず、合計pt·Lotは割当に依存しない）。**三相**＝I.収穫(6/12-6/29、6日で3回決済+252.5 pt·Lot)／II.耐久(7/1-7/31、1.5Lotで最大逆行・gold=off)／III.回収(8/1-8/7、ホルムズ→NFPで4,370.51まで)。**対称性**: ①4,097玉は6/18に4,300で半分を、8/6に残りを**同じ4,300**で決済＝同一建値・同一決済価格を7週間隔で2回。"
  - final_defense_line_changed_3950_to_3940: "**最終防衛ラインの基準変更**（誤りの訂正ではない）: 2026-06〜07-31 は **$3,950**（wk03/wk04/wk05 の trade_results.md で3週連続一貫）→ 2026-08-04以降のチャート作画は 3,940.27 / 3,944.58 / 3,961.00 と週により微調整 → **2026-08-08以降は $3,940 に統一（Boss決定）**。★**6-7月の記録に遡って$3,940で上書きしないこと**——当時運用されていた線は$3,950であり、書き換えると『3週連続で$3,950を割らなかった』という判断の記録が壊れる。**新基準の適用は次にXAUUSDの建玉を持った時点から**で、今回のキャンペーンでは一度も到達していないため実運用での検証は未実施。"
  - usdjpy_unmoved_intervention_effect_fading: "★**NFP後もドル円がほぼ無風だったことが今週一番の注目点**。**157.78（-0.64）**で終了し、米金利低下＋DXY 99.604まで売られたにもかかわらず**ドル円だけがほとんど動かなかった**。理由は①失業率が逆に低下して4.1%、②利上げは否定されず10月に先送り、③**円側の要因（財政拡張・日銀の遅れ）が重く介入効果が剥落中**。CNBC検証で7/31協調介入は163台→**155ちょうど**まで進んだが**値幅の半分近くを既に戻して158.50前後**。BofAの見立て『当局の短期目標は155割れ』に対し**155は一瞬タッチのみ**。ベッセント『**介入はシグナル、方向を変えるのは政策**』、PGIM『**介入だけで円安トレンドは反転しない、むしろ裏目に出る可能性**』。→ **157.0〜158.5のレンジで上限売り・下限買い**、**156.589割れで介入警戒モードに切替**。"
  - wti_hormuz_reopening_taco_risk_realized: "★**動画の上昇シナリオ（中東悪化→79.50）は不成立**で、実際に進んだのは逆の『**イラン=オマンによるホルムズ海峡再開合意が近い**』という緩和ニュース。**週間-8.96%**（77.08で終了・高値78.77／安値76.53）。**『イラン情勢は緩和と悪化が毎日入れ替わる』というTACOトレードのリスクが顕在化**。**76.705が重要（割れると加速）**で、正式合意なら70ドル方向・交渉決裂なら一気に82.749という**ヘッドライン主導の二極化相場**＝**持ってもポジションは軽く**。snapshot oil も surge→**range** へ。"
  - us_equity_breakout_confirmed_cpi_is_the_switch: "米国株は**強気シナジオが『的中』した側**。NDX **29,722.30（+1.19%）**／S&P500 **7,757.64（+0.62%）**／ダウ **54,036.93（+0.28%）**／ナスダック総合 **26,690.62（+1.30%）**。金利低下＝グロース株買いという素直な反応で **『29,560超えで上昇』トリガーは既に発動済み**、S&P500は**8/6に最高値更新**しその週は**4月以来最強**。月曜以降は29,560〜29,600を**上抜けたサポート**として扱い次は**29,870→30,000→30,922**、**29,560割れで初めてダマシを疑う**。wk05の『29,129割れ→28,718』は**当面棚上げ**。★ただし『**雇用純減＝景気減速**』が意識され始めると**金利低下メリットより業績懸念が勝つ局面に反転**し、**そのスイッチは8/12のCPI**。"
  - jp225_night_gap_up_but_open_high_risk: "日経は現物8/7終値 **65,606.71（-0.12%）** だが、**日経CFDが夜間セッションでNFP後に高値66,698→66,248まで買われ、月曜は600〜650円程度の上ギャップで始まる計算**。**66,340円の上抜けトリガーは夜間で既にクリア済み**で次の焦点は **67,353→67,596**。★ただし**ギャップアップ後の『寄り天』は日経の典型パターン**なので**寄り付きで飛びつかず 66,340〜66,000 への押し目を待つ**。66,000を明確に割ればギャップ埋め＝65,606。**ドル円がほぼ動いていない（円高が進んでいない）ことは日本株にとって追い風の維持**。"
  - eurusd_upside_revision_dxy_99527_common_trigger: "EURUSD **1.1558**で4H 1.15317を上抜け、**日足の重要レジスタンス1.15741に接近**。DXYが**99.604**まで下げ、前回サポート**99.527の直前**。**1.15741上抜けで1.16462まで一気**（＝DXY 99.527割れとセット）、失敗なら1.15010→1.14台。wk05の『保守的・レンジ警戒』から **1.15741ブレイク待ちの上目線に修正**。★**DXY 99.527は全通貨ペア共通のトリガー**。"
  - btc_unmoved_in_dual_rally_relative_weakness: "BTC **64,975（+0.09%）** でほぼ横ばい。**下落トリガーの64,132ドル割れは発生していない**。★**株が上昇し金が急騰する中でBTCだけ動かなかった**＝**リスクオン資産としてもインフレヘッジ資産としても買われなかった**ということで**相対的な弱さ**を示す。64,132割れ→63,844→63,720は**条件付きショート・条件成立まで待つ**、上抜けは65,500〜66,000回復から。**条件未成立のため月曜寄りの新規エントリーは見送り**。"
  - curve_belly_premium_shrank_hike_pricing_deflated: "金利カーブは 5s10s **+29.8bp（Δ+2.8・bear_steepening）**／3m10s **+106.3→+95.0bp とフラット化**（positive継続で逆イールドは遠い）／**belly_premium +26.0→+18.9bp と縮小**＝**再利上げ織り込みの瘤が萎んだ**（9月利上げ確率 64%→42% と整合）。★Boss実物年限では **真の2s10s = +45.0bp**。トレードレポート§8-4 の年輪候補『**週間の水準は往復しても、カーブの形は往復しない**』——8/3-8/7でWTI・US2Y・US10Y・DXYはほぼ往復した一方 **2s10s は +45.6→+42.9bp と一度も戻さずフラット化（NFP前時点）**＝『ノイズを剥がした後に残るのは水準ではなく形』。"
  - portfolio_us_stocks_dramatic_recovery: "口座（2026-08-08 13:34時点）: **株数変更なし**（東証・米国株とも）。総資産 4,833,577→**4,993,914円（+160,337円）**、評価損益 +256,719/+5.60%→**+417,056円/+9.11%（+3.51pt）**。★**米国株が劇的改善**: 445,969→**523,017円**、評価損益 -98,576→**-21,528円（+77,048円）**、率は **-18.10%→-3.95%**、外貨建は -604.36→**-77.37 USD（+526.99 USD）**。銘柄別: **GDX -114.60→+82.05 USD（+196.65・黒字転換）**＝金急騰の直撃、**IONQ -111.16→+10.08 USD（+121.24・黒字転換）**、**SPCX -378.60→-169.50 USD（+209.10）**＝8/6のロックアップ解除を+1.5%で吸収（トレードレポート§9）。国内株は 4,385,900→**4,469,189円**、+355,295→**+438,584円（+10.88%）**。銘柄別の明暗: **安川電 -15,600→+19,700（+35,300）**・**三菱重 -9,900→+16,400（+26,300）**・**GXゴールド特定 -8,614→+438（黒字転換）**・**GXゴールドNISA -87,600→-62,800（+24,800）**が改善、一方 **ファナック +88,300→+33,000（-55,300）** が最大の重し。特定 1,948,513円／NISA 2,520,676円。"

decision_bias:
  risk: "**Add risk gate 開放**（VIX 14.90<18）。骨格は Boss の『**利上げ先送りによる株高・金高、ただしCPI待ちの一時的な安心感**』。米国株は**29,560〜29,600を上抜けたサポート**として29,870→30,000→30,922を狙えるが、『**雇用純減＝景気減速**』が意識され始めると**金利低下メリットより業績懸念が勝つ局面に反転**する。**そのスイッチは8/12のCPI**で、どちらに転んでもボラは金曜より確実に大きくなる。日経は**寄り天リスクで飛びつかず押し目待ち**。"
  hedge: "**CFDゴールドは全決済しフラット**（持ち越しなし）＝**ヘッジ枠は現在ゼロ**。再構築するなら **4,302.18を上抜けサポートとして守れるか**が試金石で、割れれば『一日限りの過剰反応』と判断して4,248まで撤退。**最終防衛ラインは2026-08-08以降 $3,940 に統一**（新基準の実運用検証は未実施）。金は**スタグフレーション＋ドル安＋原油下落**の3層が効いた一方、**史上最高値から依然20%以上下の下降チャネル内の戻り**である点を忘れない。**DXY 99.527／10s30sの拡大**が上値追随の条件。"
  ammo: "8/12 CPI までは**イベント前のポジション軽め**が基本。米国株は上抜けサポートを使った押し目、日経は**66,340〜66,000の押し目**、WTIは**両サイドともポジションを軽く**（TACOリスク顕在化）、BTCは**条件未成立で新規見送り**。8/11(火)は日本が山の日で休場＝**お盆の薄商い本格化**でボラが出やすい。"
  usdjpy: "**157.0〜158.5のレンジ**で上限売り・下限買いの往復。**円安に戻りやすいという見立ては維持**だが159.30の売りゾーンには届かずレンジ上限を切り下げ。**156.589割れで介入警戒モードに切替**。介入効果は剥落中（163→155の値幅の半分近くを既に戻した）で、**ベッセント『介入はシグナル、方向を変えるのは政策』**が実勢に近い。imf_ammo=0 だが settings.py の asymmetry がボス更新され、**FIMAにより火力制約は消え、日米2年金利差も自律的に縮小中**＝『枠切れ＝無防備』も『8/4以降はドル買い復帰』も前提が弱い。"
  long_port: "**株数変更なし**・長期コア維持。総資産は **4,993,914円（+9.11%）** へ大幅改善し、**米国株の含み損が -18.10%→-3.95% まで縮小**（GDX・IONQが黒字転換、SPCXもロックアップ解除を吸収）。**金急騰が金鉱株（GDX）とGXゴールドの双方を押し上げた**構図で、CFDをフラットにした一方で**現物側の金エクスポージャーは残っている**点に注意（金が4,302を割れば逆回転）。国内株では**ファナックが-55,300と最大の重し**になっており、半導体・FA内の明暗が続いている。"

