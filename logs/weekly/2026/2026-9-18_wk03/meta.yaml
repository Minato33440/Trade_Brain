curve_spreads:
  spread_bp: 14.2
  change_bp_30d: -17.2
  shape: bear_flattening
  inverted: false
  spread_3m10s_bp: 102.0
  change_3m10s_bp_30d: -0.8
  shape_3m10s: stable
  spread_3m5s_bp: 87.8
  belly_premium_bp: 38.1
