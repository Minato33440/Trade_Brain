  recession_3m10s: positive
  points_pct:
    m3: 3.978
    y5: 4.856
    y10: 4.998
    y30: 5.331
  spread_10s30s_bp: 33.3
  change_10s30s_bp_1w: -4.6
  change_10s30s_bp_1w_window: 2026-09-11 -> 2026-09-18
  change_10s30s_bp_30d: -20.5
  direction_10s30s_1w: narrowing
  note: 'スプレッドの符号はすべて市場慣行の【長期−短期】（2s10sが+45bpなら10Yが2Yより45bp上）。5s10s（US10Y−US5Y=^FVX）は5年がカーブ中腹のため、front=政策(3M)が belly(5Y)
    より低い順イールド環境では最もフラットな区間＝5s10sのbear_flatteningは逆イールド接近を過大評価しうる。景気後退の主ゲージは 3m10s（spread_3m10s_bp）で読む。structure=belly_elevated
    は政策ターミナル織り込みの瘤＝front低・belly突出・long growth。shape*は短期↑/長期↓のフラット化の質、recession_3m10s が near_inversion/inverted に入ったら本格警戒。10s30s
    は【水準・Δ(週次/30日の2窓)・方向(週次Δの符号のみ)】を出すだけでレジームラベル・複合スコアには混ぜない。閾値を置かないのはサンプルが4営業日分しかないため。8〜12週ためてから閾値の検討を行う。同じスプレッドでも窓が違えば符号が逆になりうる（30日では拡大・直近1週では縮小
    等）ので、必ず窓を明示して引用すること。★本欄（機械のclose-to-close系列）が 10s30s の正本。手読みの値と1本の時系列に混ぜない。理由は【時刻とベンダーの二重の不一致】。手読みはスクショを撮った時刻に依存し（NY引け/ロンドン午後が混在しうる）、ベンダーも異なる。日次変動が1〜3bpの指標では、変化の大半が時刻差になりうる。※この2つの誤差源はまだ分離できていない（純粋なベンダー差の比較は同一時刻同士の
    n=1 のみ）。分離できれば併用可能になる余地は残る。機械側は毎日同じ時刻・同じベンダーで自動的に積み上がるため、8〜12週の計数はこちらで数える。読み筋（人間側・★未検証）: 拡大=タームプレミアム／ソブリン信用の象限で金に追い風、縮小=純粋なディスインフレで金には何も来ない。2026-08-09時点で機械系列による裏づけは無い（7営業日で符号一致5/7だが、金が週で最も上げた8/5に10s30sは縮小）。機構の仮説として保持し、実測の主張はしない。★本欄は【事後の記録】であって当日の判定には使えない。CPI等の当日反応は【同一日・同一チャートのセッション内前後比較】で見る（発表直前に
    30Y−10Y を読み、反応が落ち着いた頃に同じチャートで再度読み、その2点の差を取る）。同じ日・同じ時間帯・同じベンダーなので時刻差もベンダー差も入らない。求めているのは当日の変化であって水準ではない。'
curve_fred:
  as_of: 2026-09-17
  us2y_pct: 4.67
  us10y_pct: 4.94
  spread_2s10s_bp: 27.0
  change_2s10s_bp_1w: -12.0
  change_2s10s_bp_1w_window: 2026-09-10 -> 2026-09-17
  change_2s10s_bp_30d: -25.0
  note: '★判定はしない（レジームラベル・複合スコアに混ぜない。閾値も未設定）。curve_spreads の front は 3M で、3M は政策金利そのものに貼り付いており【利上げ確率の織り込みを構造的に持たない】。FF金利が実際に動くまで
    3M はほとんど動かないため、利上げ観測でフロントが売られる局面では 3M は必ず『動かない側』に回り、機械は必ず bull_flattening を出し続ける（2026-08-28 が実例: 機械 bull_flattening
    vs Boss ベアフラットニング）。これは front の選び方の好みではなく指標設計に由来する系統的バイアスであり、shape_3m10s / shape / yields は【政策期待の判断には使えない】。本ブロックがその位置を埋める。⚠️ただし
    H.15 は1営業日遅れるので速報性は解決しない——『速い系列（Boss実測・Yahoo）』と『揃った系列（FRED）』を別レイヤーで持つ設計。'
