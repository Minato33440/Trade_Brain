  change_5y5ybe_bp_1w: 3.0
  change_5y5ybe_bp_30d: 3.0
  direction_5y5ybe_1w: widening
  note: '年輪候補8-2の第二条件（金の上昇には ドル安 かつ BEが崩れないこと）を、代理でなく本体で測るブロック。代理は2回失敗している——10s30s（反例2件で棄却）と原油（8/19公表の7/28-29 FOMC議事録が「インフレ補償は原油高にほとんど動かず／近期のインフレ補償は6月FOMC後に大きく低下し、その後原油の急騰にもかかわらず小幅にしか戻らなかった」と明示して否定）。★判定はしない:
    レジームラベルにも他のどの合成指標にも混ぜず、閾値も置かない（「BEが崩れた」の水準を今決めない）。サンプルがゼロの指標に判定させると判定が実測より先に固まる＝8-2で2回やった失敗そのもの。8〜12週ためてから検討する。★原油との相関は自動計算しない。議事録の観測は1期間分の1事例で、まだ自分で確かめていない。機械が相関を出すと検証済みの事実として扱われる。まず生の系列をためる。★2本ある理由:
    近期(5Y BE)はエネルギー価格の影響を受けやすく、5y5yフォワードはそれを剥いだアンカー。差が診断になる——5Y BEだけ動いて5y5yが動かない=市場は原油の影響を一時的と見ている / 両方動く=インフレ期待そのものが動いた。8-2が問いたいのは後者なので1本だけでは判別できない。★as_of
    は Yahoo 側より1日古いことが常にありうる（FREDの公表ラグ）。同日として比較しないこと。'
