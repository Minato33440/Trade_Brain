curve_fred:
  # FRED DGS2/DGS10（NY引け基準・公表ラグあり）。★curve_spreads（Yahoo系）と統合しないこと。
  # 2つ同時に出るのは重複ではなく、フィード差を測れる状態を意図的に作っている（年輪§8(e)）。
  as_of: 2026-09-03        # ★必須。Yahoo側より1営業日古いことが常にありうる
  us2y_pct: 4.34          # DGS2＝政策期待を見る位置のフロント
  us10y_pct: 4.77
  spread_2s10s_bp: 43.0      # 符号は市場慣行の【長期−短期】
  change_2s10s_bp_1w: -4.0
  change_2s10s_bp_1w_window: 2026-08-27 -> 2026-09-03   # ★実際に引き算した2日。符号を読む前にここを見る
  change_2s10s_bp_30d: 0.0
  note: "★判定はしない（レジームラベル・複合スコアに混ぜない。閾値も未設定）。curve_spreads の front は 3M で、3M は政策金利そのものに貼り付いており【利上げ確率の織り込みを構造的に持たない】。FF金利が実際に動くまで 3M はほとんど動かないため、利上げ観測でフロントが売られる局面では 3M は必ず『動かない側』に回り、機械は必ず bull_flattening を出し続ける（2026-08-28 が実例: 機械 bull_flattening vs Boss ベアフラットニング）。これは front の選び方の好みではなく指標設計に由来する系統的バイアスであり、shape_3m10s / shape / yields は【政策期待の判断には使えない】。本ブロックがその位置を埋める。⚠️ただし H.15 は1営業日遅れるので速報性は解決しない——『速い系列（Boss実測・Yahoo）』と『揃った系列（FRED）』を別レイヤーで持つ設計。"

