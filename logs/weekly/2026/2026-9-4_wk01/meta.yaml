signals:
  - nfp_upside_surprise_flipped_the_yen_thesis: "★★**9/4 21:30 の NFP が +16.2万人（予想5.5万人の3倍近く）、しかも7月 -2.3万人→+2.1万人・6月→+3.1万人と二重の上方修正**。失業率 4.1% 据え置き、平均時給 前年比 +3.1%（前月3.2%から鈍化＝**インフレ再燃の決定打にはならない**）。→ **『雇用は冷えているが崩壊していない』から『雇用は底堅い』への解釈転換**。教科書通りの**グッドニュース・イズ・バッドニュース**で、**9月FOMC利上げ織り込みが 52-54% → 59-61%**、米金利は全年限で上昇、ドル指数も上昇、**株は逆に売られた**（ダウ-0.51%/S&P-0.38%/NASDAQ-0.29%。★**小型株ラッセル2000のみ+0.25%**）。★★**Boss の短期予想（NFPが5.5万人を超えたら円安に巻き戻る）は的中したが、中期予想（水曜まで円高）の前提だった『弱い雇用統計→FRBは動けない』が崩れた**。→ **来週前半は円高シナリオの再検証が必要**。★**X側は本体に無い論点を足している**——**NFPの内訳が狭い**（飲食・バー ~59k ＋ 地方政府の教育 ~42k、季節調整の影響が大きく『広範な好況ではない』）。⚠️**未突合**"
  - us_steepens_while_japan_flattens: "★★**米はスティープ化、日はフラット化。逆方向**（Rex§A・本体に項目なし）。**米 2s10s 37.0 → 41.0bp（+4.0bp）**は US2Y +1.4bp／US10Y +5.4bp の**長期主導**、**日 2s10s 121.9 → 108.5bp（-13.4bp）**は JP2Y **+12.7bp**／JP10Y -0.7bp の**短期主導**。★**JP2Y +12.7bp は当週で最も動いた金利**で、日銀9/17-18（利上げ確率約8割・0.5%浮上との観測）の織り込みが2年に集中し、10年は **GPIF の国内債回帰**で頭打ち——**本体の読みと数値が一致**。⚠️Boss は『日銀が短期を利上げしても長期がブル・フラットニング的に頭打ちになるリスク』を警戒し、**日本国債はスティープ化（2年上昇・10年頭打ち）のポジションが妥当**としている"
  - yen_strength_is_driven_by_the_2y_spread: "★★**円高を駆動しているのは『短期の金利差』**（Rex§B）。**2年 日米差 266.0 → 254.7bp（-11.3bp・縮小）／10年 日米差 181.1 → 187.2bp（+6.1bp・拡大）／USDJPY 160.079 → 156.195（-2.43%）**。→ ★**円高は短期の金利差縮小と同方向、長期の金利差拡大とは逆方向。当週の円高は長期ではなく2年ゾーンが駆動している**。★**Boss の中期テーゼ『為替介入をせずとも金利差縮小だけで20円規模の円高（2024年7月末の日銀利上げ後と同型）』の内訳を初めて測れた週**。⚠️★**サンプルは当週1件のみ。機構は閉じない**——事前登録 P11 として登録し、**判定材料としてのみ使用・レジームスコアには入れない**。★**10年差でも同じ表を作り、どちらが説明力を持つかを併走させる**"
  - jh_hawkish_effect_decayed_within_a_week: "★★**イベント由来の織り込みは減衰する**（Rex§C）。9月利上げ確率の経路は **35%（8/28 JH直前）→ 57-60%（JH直後）→ ★52-54%（9/4 NFP直前）→ 59-61%（NFP直後）**。→ ★★**ウォーシュのタカ派講演の効果は1週間で 57-60% → 52-54% へ一部剥落していた。NFPはそれを元の水準に戻しただけで、JH直後を大きく超えてはいない**。★**wk04 §E で『事前登録した非対称が低確率側で的中』と記録したが、その効果の持続性は1週だった**という追記になる。⚠️**P9（政府の長期金利抑制策は5営業日以内に剥落）と同型の現象だが、主体も対象も違うので同じ機構とは扱わない。別の観測として記録する**"
  - execution_not_price_made_the_week: "★★**金が週間 -0.52%（4,454.26 → 4,431.07）下げた週に、通算は +163.26 → +336.53 pt·Lot（+173.27）**。内訳は実現 +163.00 ＋ 含み増 +10.27。★**価格の方向ではなく、執行が利益を作った週**。効いた3操作: ①**旧キャンペーンのラダー**（4,460半値 → 4,380全決済）で 1.0 を 4,380 一括の +89.00 に対し **+129.00**（差 +40.00）／②**9/2 の再エントリー**（4,309/4,313）——再参入しなければ通算は +129.00 止まりで、**差 +207.53**／③**NFPの往復**（4,394決済 → 4,374再入）で +10.00、**ゼロ点は 4,232 → 4,222 に低下**。★**確定5件・4勝1敗（勝率80.0%）**で、前2週（wk03=2件、wk04=0件）から執行が一気に増えた"
  - preregistration_with_action_actually_fired: "★★**wk04 で記録した『設計の欠落』が翌週に執行として閉じた**。wk04 §4-3 は『事前登録されていたのは配置の認識と 8/6 の前例だけで、**行動が書かれていなかった**。パターン認識が正しくても行動ルールが対になっていなければ結果に接続しない。**判断の誤りではなく設計の欠落**』（4,660.71 で半値決済していれば +266.49 / 実際 +163.26 → 差 +103.22）と記録した。★**2026-08-29 に trigger と action を対で登録**（寄りが4,500水準を上回る→継続／**上回らない→半値決済**／**4,400を割る→全決済**）した結果、**8/31 09:30 @4,460 と 9/1 20:00 @4,380 で2件とも執行**され、旧キャンペーンは **+129.00** で完結。→ ★**`trigger`/`action`/`invalidation` の3欄必須化の提案は実効性が確認された**"
  - dfii5_preregistration_resolved_at_plus_5bp_row: "★★**§D（実質金利チャネルの事前登録）が閉じた**。wk04 で『DGS5・DFII5 の 8/28 は行そのものが存在しない』と記録した分が当週に公表され、**ΔDGS5 = +10.0bp / ΔDFII5 = +11.0bp / 恒等式は 8/28 も 0.00**。→ ★**事前登録の該当行は「+5bp 以上」**＝『実質金利チャネルが働いている。8-2/8-3 とは別に「実質金利↑→金↓」を新規候補として立てる』。⚠️**本アーカイブは判定文を書かない**（handoff §5-5。**新規候補の定式化は Boss/Rex 側**）。★★**あわせて wk04 で立てた範囲制約が実測で当たった**——Boss は他年限（US2Y +12.6bp / US10Y +5.4bp）で挟んで **ΔDGS5 ≈ +5〜+13bp → ΔDFII5 ≈ +6〜+14bp、符号は正、分岐は『+5bp以上』の公算**と予測し、**実測はいずれも範囲内で、関係式 ΔDFII5 = ΔDGS5 + 1.0bp も 11.0 = 10.0 + 1.0 で厳密に成立**。★**これは代理指標ではない**（恒等式と他年限による範囲の制約であって、DFII5 の代わりに何かを使ったのではない）。★**公表タイミング差も再現（n=2）**——当週も T5YIE は 9/4 まで、DGS5/DFII5 は 9/3 まで。**1回限りではなく構造**"
  - curve_fred_first_output_two_findings: "★★**是正A（front を 2Y へ）を実装し、`curve_fred` が初出力された**。FRED DGS2/DGS10 を `FRED_SERIES` に追加（**curve_spreads とは統合しない**）。**as_of 2026-09-03 / 2s10s +43.0bp**。★**初回で2つ分かった**: ①**別フィードでも週次Δが完全一致した**——FRED 8/28 39.0 → 9/3 **43.0bp = +4.0bp**、Boss TVC 8/28 37.0 → 9/4 **41.0bp = +4.0bp**。**水準だけ 2.0bp ずれ、傾きは一致**（⚠️n=1）。②★★**機械の change_2s10s_bp_1w = -4.0 は符号ごと逆に出ている**——週次Δは『7暦日前以前の最後の終値』基準で 9/3 の7日前は **8/27** に落ち、**8/28 を跨がない**。FRED 2s10s は **8/28 の1日で 47.0 → 39.0（-8.0bp）**とフラット化しており、**この1日を窓に入れるか外すかだけで符号が反転する**。→ **『必ず窓を明示して引用する』の実例がもう1件**。⚠️**本週の -4.0 を『フラット化した』と読まない**"
  - nan_audit_closed_with_a_single_choke_point: "★★**H-3（NaN → unknown の悉皆是正）を実装した**。Boss訂正（2026-08-29）『関数ごとに if を足すのではなく、テストが穴の一覧を出す形にする』に従い、**`build_regime_snapshot._num()` を新設して値の入口（_get_pair / _get_first / _get_prev_1w）で NaN を None に落とす**。1箇所に絞ったので既存の `is None` ガードが**全判定関数で正しく効き、新しい判定関数を足しても同じ穴が開かない**。テストは `tests/test_regime_nan.py` 4本（**pytest 不要で単体実行可**・**4/4 pass**）。★**本丸は3本目『NaN と None で regime ブロックが完全一致すること』**——個別に if を足す是正では直し忘れた関数だけ差分が残るが、**ブロック全体の一致で縛れば新しい判定関数を足したときに穴が開いた瞬間に落ちる**"
  - snapshot_dates_aligned_this_week: "★**本週の snapshot は日付が揃っている**（全ペアが 2026-09-04。BTCのみ週末値9/6）。**wk04 の『金利4本が 8/27＝ウォーシュ講演の前・US100 が NaN』という特例は当週には適用しない**。★**機械 US10Y 4.784 は Boss TVC 週足終値 4.784 と完全一致**。⚠️ただし **wk04→wk01 の機械の金利差は 8/27→9/4（6営業日）**で週次ではなく、他ペア（8/28→9/4・5営業日）とも窓が揃っていない。**週間騰落は Boss 実測を正本とする**。★**relative_strength の `verdict: mixed` も、wk04 は NaN の産物だったが当週は実際の値から出た mixed**——**2週連続で同じラベルだが中身がまったく違う**"
  - inflation_compensation_reversed_and_near_term_led: "★★**BE の方向が反転し、近期が長期の7倍動いた**。5Y BE **2.30 → 2.37%（Δ1w +7.0bp）**／5y5y BE **2.32 → 2.33%（Δ1w +1.0bp）**、**wk04 は両方 narrowing だったのが当週は両方 widening**。→ ★**2本持っている理由がそのまま出た形**——**5Y BE だけ大きく動いて 5y5y がほとんど動かない＝市場は当週のインフレ材料を『一時的』と見ている**と読める配置。⚠️**判定はしない**（閾値未設定・レジームラベルにも複合指標にも混ぜていない）。⚠️**原油との相関は自動計算しない**——当週 WTI +9.19% と方向は揃うが**機構として結ばない**（2026-08-19 公表の 7/28-29 FOMC 議事録が『インフレ補償は原油高にほとんど動かず』と明示している）"
  - oil_geopolitics_two_directional_again: "★**WTI 週間 +9.19%（84.059 → 91.784）が当週最大の変化**。イラン情勢（ホルムズ海峡リスク、ブレント95ドル近辺）が地政学プレミアムの主因で、**92ドル手前でダブル/トリプルトップ**、金曜も92近辺で頭打ち。★**`--news` 2件がともにイラン**で、**①米軍がイランのタンカー3隻を攻撃・破壊**（『米軍艦へのミサイル攻撃の報復』）と**②トランプ大統領が『取るに足らないことだ』と戦争を矮小化**。⚠️★**方向が逆の材料が同時に出ている**（実弾の応酬 vs 当事者による矮小化）——**wk04 の『制裁拡大 vs 通航量回復』と同じ構図。どちらも記録し、片方に寄せない**。★**地政学リスクは方向が非対称**（封鎖・施設攻撃の確証で95-100超え、和平の兆しで86-89まで一気に押し戻し）。X側は『7月中旬以来の最大の週間上昇』『ホルムズの商品通航が1日1桁台 vs 平常の十数隻』（⚠️未検証）"
  - portfolio_turned_and_fx_passthrough_appeared: "★★**総資産が -146,654円（-2.90%）で反転**（wk04 は +33,381）。評価損益 +450,101/+9.77% → **+321,241/+7.00%（-2.77pt）**。★★**当週の主役は為替の素通し**——**米国株は外貨建てで +155.26 → +233.26 USD（+78.00 USD / +2.46pt）と改善したのに、円換算では +20,021 → +21,411円（+1,390円）しか増えていない**。★**最も明快なのは SPCX**: 外貨建は **-73.19 → +10.66 USD でプラス転換**したのに**円換算は -9,418円のマイナス**（取得時 USDJPY ≈162.1 vs 現在 ≈156.3）。→ **trade_results §17『2243・1655 はほぼ確実にヘッジ無し』で予告された為替の素通しが、当週から口座の数字に出始めた**。国内は **7011 が +14,500 → -12,600 で符号反転（-27,100）**が個別最大の悪化、**425A NISA が -6,200 → -41,200（-35,000）**、**2243 は -33,060 だが +272,136 で単独最大の牽引役を維持**。★**513A は 9/1 のリバランスで売却済み**（Boss報告 2026-09-06。差引 -13,814 がスィープ減少と完全一致。実現損 -17,780＝損出し執行済み）。★**評価損益の比較は構成が変わっており、513A を除いた比較可能ベース +466,601 に対し当週 +321,241 で差は -145,360＝ヘッドラインの -128,860 より約16,500 大きい**。★★**425A 週間 -4.48% は金の週足と比べてはいけない**——**東証ETFは東証引け15:00 JST の原資産を反映**し、**8/28 15:00 はウォーシュ講演の前**。**15:00基準なら -4.90% で実測とほぼ一致**（年輪§8(e) の同型）"
  - jp225_rose_on_domestic_material_not_the_yen: "★**日経225 CFD は金曜 64,287 → 65,951 まで駆け上がり 65,813（+1.77%）引け**。⚠️★**押し上げ役は円安地合いの追い風ではなく別材料**（Boss）——**GPIF の国内回帰方針**と**キオクシア新型BiCSフラッシュ材料**（半導体センチメント改善。**200A・2243 保有と整合的**）。★機械の相対強度もこれと整合: **円建てでは JP225 が US100 を 0.29pt 下回るが、FX調整後は 1.09pt 上回る**（通貨効果 -1.39pt＝円高が円建てパフォーマンスを押し下げていた）。⚠️★★**最大の警戒点は 9/17-18 の日銀会合そのもの**——**2024年8月の利上げ後急落（日経-20%規模）の再現リスク**。**9/18 接近での新規ロング積み増しは避ける**（Boss）。★**GMポートフォリオ本体（200A・2243・ロボFA中心・長期）はこの短期ノイズでは動かさない**"

